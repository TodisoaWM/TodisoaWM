{% extends 'base.html' %}
{% block title %}Paramètres — FacturePro{% endblock %}
{% block page_title %}Paramètres{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="stat-card">
      <h6 class="fw-700 mb-4" style="font-weight:700; font-size:1rem">Informations de votre entreprise</h6>
      <form method="POST">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-semibold">Nom de l'entreprise</label>
            <input type="text" name="company_name" class="form-control"
              value="{{ settings.company_name }}" placeholder="Mon Entreprise">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Adresse</label>
            <input type="text" name="company_address" class="form-control"
              value="{{ settings.company_address }}" placeholder="Rue, BP...">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Ville</label>
            <input type="text" name="company_city" class="form-control"
              value="{{ settings.company_city }}" placeholder="Antananarivo">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="company_email" class="form-control"
              value="{{ settings.company_email }}" placeholder="contact@monentreprise.mg">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Téléphone</label>
            <input type="text" name="company_phone" class="form-control"
              value="{{ settings.company_phone }}" placeholder="+261 ...">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Devise</label>
            <input type="text" name="currency" class="form-control"
              value="{{ settings.currency }}" placeholder="Ar" style="max-width:80px">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Préfixe facture</label>
            <input type="text" name="invoice_prefix" class="form-control"
              value="{{ settings.invoice_prefix }}" placeholder="FACT-">
          </div>
        </div>
        <hr class="my-4">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg me-1"></i>Enregistrer
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
